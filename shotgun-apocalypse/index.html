<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d11"><title>SHOTGUN APOCALYPSE — REALISM 03</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090d11;color:#eee;font:14px system-ui;display:grid;place-items:center}.load{max-width:520px;padding:32px;text-align:center}.bar{height:4px;background:#26313b;margin:20px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ff7138;transition:width .2s}small{color:#9aa8b6}</style></head><body><main class="load"><h2>SHOTGUN APOCALYPSE</h2><p>Loading the game…</p><div class="bar"><i id="p"></i></div><small id="s">Preparing embedded game assets</small></main><script>(async()=>{try{const count=18,chunks=[];for(let i=0;i<count;i++){const name=String(i).padStart(3,'0');const r=await fetch('parts/'+name+'.b64?v=f678bad',{cache:'force-cache'});if(!r.ok)throw Error('Game data part '+(i+1)+' failed: HTTP '+r.status);chunks.push(await r.text());document.getElementById('p').style.width=((i+1)/count*100)+'%';document.getElementById('s').textContent='Loading game data '+(i+1)+' / '+count;}const binary=atob(chunks.join(''));chunks.length=0;const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();}catch(e){document.getElementById('s').textContent='Could not load game: '+e.message;console.error(e)}})();</script></body></html>
